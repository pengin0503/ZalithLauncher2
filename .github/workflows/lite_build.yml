name: Lite Build (arm64 Debug)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lite-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      LEGAL_DOCS_TOKEN: ${{ secrets.LEGAL_DOCS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Android NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$ndk" ] || [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install "ndk;27.0.12077973"
            ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "Using NDK at $ndk"
          test -f "$ndk/source.properties"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Build lite arm64 debug
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleDebug -Darch=arm64 -PliteBuild=true

      - name: Assert lite payload
        run: |
          set -euo pipefail
          apk=$(ls ZalithLauncher/build/outputs/apk/debug/*.apk | head -n1)
          echo "APK: $apk ($(du -h "$apk" | cut -f1))"
          for bad in 'assets/runtimes/jre-8/' 'assets/runtimes/jre-17/' 'lib/arm64-v8a/libOSMesa_2300d.so'; do
            if unzip -l "$apk" | grep -Fq "$bad"; then echo "unexpected: $bad"; exit 1; fi
          done
          for good in 'assets/runtimes/jre-21/' 'assets/runtimes/jre-25/' 'lib/arm64-v8a/libmobileglues.so' 'lib/arm64-v8a/libOSMesa_2121.so' 'lib/arm64-v8a/libOSMesa_8.so'; do
            if ! unzip -l "$apk" | grep -Fq "$good"; then echo "missing: $good"; exit 1; fi
          done

      - name: Upload lite arm64 debug APK
        uses: actions/upload-artifact@v7
        with:
          name: zalith-lite-arm64-debug
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
